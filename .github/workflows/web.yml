name: Web

# The website (apps/web, crates/web-engine). Pull requests that touch it
# build the WebAssembly and run the tests. A push to main that touches it also
# deploys it to Cloudflare, at app.mangapoint.org (apps/web/wrangler.jsonc), as
# does "Run workflow". That needs the repository secrets CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID (docs/web.md, Hosting).

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "crates/web-engine/**"
      - "tools/*web*"
      - "tools/web-e2e/**"
      - "tools/check-architecture.mjs"
      - "tools/shared-ui.test.mjs"
      - "crates/ui/**"
      - "crates/formats/**"
      - "Cargo.toml"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "crates/web-engine/**"
      - "tools/*web*"
      - "tools/web-e2e/**"
      - "tools/check-architecture.mjs"
      - "tools/shared-ui.test.mjs"
      - "crates/ui/**"
      - "crates/formats/**"
      - "Cargo.toml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: "0.2.129"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked

      - name: Shared architecture and page scripts
        run: |
          node tools/check-architecture.mjs
          node --test tools/shared-ui.test.mjs

      - name: Clippy (page and engine, native and WebAssembly)
        run: |
          cargo clippy -p mangapoint-web -p mangapoint-ui -p web-engine --all-targets --locked -- -D warnings
          cargo clippy -p mangapoint-web --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Native tests
        run: cargo test -p formats -p mangapoint-web -p mangapoint-ui -p web-engine --locked

      - name: Build the site
        run: bash tools/build-web.sh

      - name: JavaScript tests (ZIP reader, importer with the real engine)
        run: node --test apps/web/js/test/*.test.js

      - name: Keep the built site
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist

  deploy:
    name: Deploy to app.mangapoint.org
    # Main only: pull requests build and test, and never deploy.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: app.mangapoint.org
      url: https://app.mangapoint.org/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      - uses: cloudflare/wrangler-action@v3
        with:
          # Without this the action installs its own old Wrangler (3.90), which can't deploy a
          # Worker that only serves files ("Missing entry-point").
          wranglerVersion: "4.153.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy
