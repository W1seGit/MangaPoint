name: Package

# Builds MangaPoint for Windows, Linux and macOS and uploads each as a build
# artifact. Used by CI (to test packaging) and by the release workflow (which
# publishes the files). Not run on its own except by hand.

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Version
        id: version
        shell: bash
        run: echo "value=$(python tools/release.py current)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --locked -p mangapoint --target ${{ matrix.target }}

      # Each platform's file is something you run or install directly, not an
      # archive: a .exe, a .dmg and a .deb (plus the bare Linux program).
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Path dist | Out-Null
          # The installer (Start menu entry, uninstaller), built with Inno Setup.
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp "/DAppVersion=$version" "/DSourceExe=$PWD\target\${{ matrix.target }}\release\mangapoint.exe" "/DOutputDir=$PWD\dist" tools\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer was not built" }
          # And the program on its own, for anyone who would rather not install it.
          Copy-Item "target/${{ matrix.target }}/release/mangapoint.exe" "dist/MangaPoint-$version-${{ matrix.label }}-portable.exe"
          foreach ($f in Get-ChildItem dist -File) {
            (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $f.Name | Out-File "$($f.FullName).sha256" -Encoding ascii
          }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/mangapoint" "dist/MangaPoint-$version-${{ matrix.label }}"
          bash tools/package-linux-deb.sh "target/${{ matrix.target }}/release/mangapoint" "$version" "dist/MangaPoint-$version-${{ matrix.label }}.deb"
          sudo apt-get install -y --no-install-recommends rpm
          bash tools/package-linux-rpm.sh "target/${{ matrix.target }}/release/mangapoint" "$version" "dist/MangaPoint-$version-${{ matrix.label }}.rpm"
          (cd dist && for f in MangaPoint-*; do case "$f" in *.sha256) ;; *) sha256sum "$f" > "$f.sha256" ;; esac; done)

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name="MangaPoint-${{ steps.version.outputs.value }}-${{ matrix.label }}.dmg"
          bash tools/package-macos.sh "target/${{ matrix.target }}/release/mangapoint" "${{ steps.version.outputs.value }}" "dist/$name"
          (cd dist && shasum -a 256 "$name" > "$name.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: MangaPoint-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
