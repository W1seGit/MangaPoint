[package]
name = "mangapoint"
version.workspace = true
edition.workspace = true
description = "The easiest way to get manga onto your e-reader: search, download, crop and convert in one app, then send it to your device"
license = "MIT"
repository = "https://github.com/W1seGit/MangaPoint"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
catalog = { path = "../../crates/catalog" }
library = { path = "../../crates/library" }
mangapoint-ui = { path = "../../crates/ui" }
web-engine = { path = "../../crates/web-engine", default-features = false, features = ["core"] }
sources = { path = "../../crates/sources" }
search = { path = "../../crates/search" }
pipeline = { path = "../../crates/pipeline" }
converter = { path = "../../crates/converter", features = ["serde"] }
device-profiles = { path = "../../crates/device-profiles", features = ["serde"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
futures-util = "0.3"
ctrlc = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
base64 = "0.23"
sha2 = "0.11"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
rfd = "0.17"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

[dev-dependencies]
catalog = { path = "../../crates/catalog", features = ["fake"] }

[build-dependencies]
winresource = "0.1"
