[package]
name = "mangapoint-web"
version.workspace = true
edition.workspace = true
description = "The MangaPoint website: read, import and export your own books in the browser. Nothing is uploaded."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["web", "macro", "html", "signals", "hooks", "launch"] }
library = { path = "../../crates/library" }
device-profiles = { path = "../../crates/device-profiles", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
