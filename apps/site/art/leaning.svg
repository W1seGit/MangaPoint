<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 52" shape-rendering="crispEdges" role="img" aria-label="The mascot, leaning on the picture of the app"><style>.mascot { display: block; overflow: visible; shape-rendering: crispEdges; image-rendering: pixelated; flex: none; } .desk-scene { shape-rendering: crispEdges; image-rendering: pixelated; } .m-head { animation: m-nod 6s steps(1, end) infinite; } .m-head.m-walk { animation-duration: 2.6s; } @keyframes m-nod { 0% { transform: translateY(0); } 50% { transform: translateY(1px); } 100% { transform: translateY(0); } } .look-blink { opacity: 0; animation: look-blink 7s steps(1, end) infinite; } .look-open { animation: look-open 7s steps(1, end) infinite; } @keyframes look-open { 0%, 92% { opacity: 1; } 92.01%, 96% { opacity: 0; } 96.01%, 100% { opacity: 1; } } @keyframes look-blink { 0%, 92% { opacity: 0; } 92.01%, 96% { opacity: 1; } 96.01%, 100% { opacity: 0; } } .m-steam { opacity: 0; animation: m-steam 4.5s ease-out infinite; } .m-steam.s1 { animation-delay: 1.5s; } .m-steam.s2 { animation-delay: 3s; } @keyframes m-steam { 0% { opacity: 0; transform: translateY(2px); } 30% { opacity: 0.85; } 100% { opacity: 0; transform: translateY(-7px); } } .m-glass { animation: m-sway 9s ease-in-out infinite; } @keyframes m-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } } .m-window .m-lit { opacity: 0; animation: m-lit 9s steps(1, end) infinite; } .m-window.w1 .m-lit { animation-delay: 3s; } .m-window.w2 .m-lit { animation-delay: 6s; } @keyframes m-lit { 0% { opacity: 1; } 33% { opacity: 0; } } .m-drop { animation: m-drop 4.5s ease-in-out infinite; } @keyframes m-drop { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(4px); } } .m-step.pass, .m-step.two { opacity: 0; } .m-step.one { animation: m-step-one 2.8s steps(1, end) infinite; } .m-step.pass { animation: m-step-pass 2.8s steps(1, end) infinite; } .m-step.two { animation: m-step-two 2.8s steps(1, end) infinite; } 