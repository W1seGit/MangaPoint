<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 72" shape-rendering="crispEdges" role="img" aria-label="Manga from the web going to an e-reader, past the MangaPoint mascot"><style>.mascot { display: block; overflow: visible; shape-rendering: crispEdges; image-rendering: pixelated; flex: none; } .desk-scene { shape-rendering: crispEdges; image-rendering: pixelated; } .m-head { animation: m-nod 6s steps(1, end) infinite; } .m-head.m-walk { animation-duration: 2.6s; } @keyframes m-nod { 0% { transform: translateY(0); } 50% { transform: translateY(1px); } 100% { transform: translateY(0); } } .look-blink { opacity: 0; animation: look-blink 7s steps(1, end) infinite; } .look-open { animation: look-open 7s steps(1, end) infinite; } @keyframes look-open { 0%, 92% { opacity: 1; } 92.01%, 96% { opacity: 0; } 96.01%, 100% { opacity: 1; } } @keyframes look-blink { 0%, 92% { opacity: 0; } 92.01%, 96% { opacity: 1; } 96.01%, 100% { opacity: 0; } } .m-steam { opacity: 0; animation: m-steam 4.5s ease-out infinite; } .m-steam.s1 { animation-delay: 1.5s; } .m-steam.s2 { animation-delay: 3s; } @keyframes m-steam { 0% { opacity: 0; transform: translateY(2px); } 30% { opacity: 0.85; } 100% { opacity: 0; transform: translateY(-7px); } } .m-glass { animation: m-sway 9s ease-in-out infinite; } @keyframes m-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } } .m-window .m-lit { opacity: 0; animation: m-lit 9s steps(1, end) infinite; } .m-window.w1 .m-lit { animation-delay: 3s; } .m-window.w2 .m-lit { animation-delay: 6s; } @keyframes m-lit { 0% { opacity: 1; } 33% { opacity: 0; } } .m-drop { animation: m-drop 4.5s ease-in-out infinite; } @keyframes m-drop { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(4px); } } .m-step.pass, .m-step.two { opacity: 0; } .m-step.one { animation: m-step-one 2.8s steps(1, end) infinite; } .m-step.pass { animation: m-step-pass 2.8s steps(1, end) infinite; } .m-step.two { animation: m-step-two 2.8s steps(1, end) infinite; } @keyframes m-step-one { 0% { opacity: 1; } 25% { opacity: 0; } } @keyframes m-step-pass { 0% { opacity: 0; } 25% { opacity: 1; } 50% { opacity: 0; } 75% { opacity: 1; } } @keyframes m-step-two { 0% { opacity: 0; } 50% { opacity: 1; } 75% { opacity: 0; } } .m-road { animation: m-road 2.8s steps(14) infinite; } @keyframes m-road { from { transform: translateX(0); } to { transform: translateX(-14px); } } .m-hills { animation: m-hills 64s steps(128) infinite; } @keyframes m-hills { from { transform: translateX(0); } to { transform: translateX(-128px); } } @media (prefers-reduced-motion: reduce) { .m-head, .m-steam, .m-glass, .m-window .m-lit, .m-drop, .m-step, .m-road, .m-hills, .look-open, .look-blink, .m-orbit, .m-orbit .mascot { animation: none; } .m-steam.s0 { opacity: 0.8; } .look-blink { opacity: 0; } }.in-l,.in-r,.in-up{animation:in-l .9s cubic-bezier(.2,.8,.2,1) 1s backwards}.in-r{animation-name:in-r;animation-delay:1.1s}.in-up{animation-name:in-up;animation-delay:1.25s}@keyframes in-l{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}@keyframes in-r{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}@keyframes in-up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}.fly{opacity:0;animation:fly 3.6s 2.4s infinite}.fly.f1{animation-delay:4.2s}@keyframes fly{0%{transform:translate(0,0);opacity:0;animation-timing-function:steps(4)}6%{opacity:1}15%{transform:translate(19px,-30px);animation-timing-function:steps(3)}30%{transform:translate(37px,-35px);animation-timing-function:steps(4)}50%{transform:translate(62px,-36px);animation-timing-function:steps(4)}70%{transform:translate(87px,-33px);animation-timing-function:steps(3)}85%{transform:translate(106px,-22px);animation-timing-function:steps(3)}90%{opacity:1}96%{transform:translate(124px,-6px);opacity:0}100%{transform:translate(124px,-6px);opacity:0}}.pg.b{opacity:0}.pg.a{animation:pg-a 3.6s steps(1,end) 4.056s infinite}.pg.b{animat