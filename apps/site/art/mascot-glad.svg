<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 6 44 57" shape-rendering="crispEdges" role="img" aria-label="Rullo, delighted"><style>.mascot { display: block; overflow: visible; shape-rendering: crispEdges; image-rendering: pixelated; flex: none; } .desk-scene { shape-rendering: crispEdges; image-rendering: pixelated; } .m-head { animation: m-nod 6s steps(1, end) infinite; } .m-head.m-walk { animation-duration: 2.6s; } @keyframes m-nod { 0% { transform: translateY(0); } 50% { transform: translateY(1px); } 100% { transform: translateY(0); } } .look-blink { opacity: 0; animation: look-blink 7s steps(1, end) infinite; } .look-open { animation: look-open 7s steps(1, end) infinite; } @keyframes look-open { 0%, 92% { opacity: 1; } 92.01%, 96% { opacity: 0; } 96.01%, 100% { opacity: 1; } } @keyframes look-blink { 0%, 92% { opacity: 0; } 92.01%, 96% { opacity: 1; } 96.01%, 100% { opacity: 0; } } .m-steam { opacity: 0; animation: m-steam 4.5s ease-out infinite; } .m-steam.s1 { animation-delay: 1.5s; } .m-steam.s2 { animation-delay: 3s; } @keyframes m-steam { 0% { opacity: 0; transform: translateY(2px); } 30% { opacity: 0.85; } 100% { opacity: 0; transform: translateY(-7px); } } .m-glass { animation: m-sway 9s ease-in-out infinite; } @keyframes m-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } } .m-window .m-lit { opacity: 0; animation: m-lit 9s steps(1, end) infinite; } .m-window.w1 .m-lit { animation-delay: 3s; } .m-window.w2 .m-lit { animation-delay: 6s; } @keyframes m-lit { 0% { opacity: 1; } 33% { opacity: 0; } } .m-drop { animation: m-drop 4.5s ease-in-out infinite; } @keyframes m-drop { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(4px); } } .m-step.pass, .m-step.two { opacity: 0; } .m-step.one { animation: m-step-one 2.8s steps(1, end) infinite; } .m-step.pass { animation: m-step-pass 2.8s steps(1, end) infinite; } .m-step.two { animation: m-step-two 2.8s steps(1, end) infinite; } @keyframes m-step-one { 0% { opacity: 1; } 25% { opacity: 0; } } @keyframes m-step-pass { 0% { opacity: 0; } 25% { opacity: 1; } 50% { opacity: 0; } 75% { opacity: 1; } } @keyframes m-step-two { 0% { opacity: 0; } 50% { opacity: 1; } 75% { opacity: 0; } } .m-road { animation: m-road 2.8s steps(14) infinite; } @keyframes m-road { from { transform: translateX(0); } to { transform: translateX(-14px); } } .m-hills { animation: m-hills 64s steps(128) infinite; } @keyframes m-hills { from { transform: translateX(0); } to { transform: translateX(-128px); } } @media (prefers-reduced-motion: reduce) { .m-head, .m-steam, .m-glass, .m-window .m-lit, .m-drop, .m-step, .m-road, .m-hills, .look-open, .look-blink, .m-orbit, .m-orbit .mascot { animation: none; } .m-steam.s0 { opacity: 0.8; } .look-blink { opacity: 0; } }</style><g transform="translate(10 6)"><g class="m-body"><path fill="#000000" d="M9 35h1v1h-1zM34 35h1v1h-1zM9 36h1v1h-1zM34 36h1v1h-1zM8 37h2v1h-2zM34 37h2v1h-2zM8 38h1v1h-1zM35 38h1v1h-1zM8 39h1v1h-1zM35 39h1v1h-1zM8 40h1v1h-1zM35 40h1v1h-1zM8 41h1v1h-1zM35 41h1v1h-1zM8 42h1v1h-1zM35 42h1v1h-1zM8 43h1v1h-1zM35 43h1v1h-1zM7 44h2v1h-2zM35 44h2v1h-2zM4 45h4v1h-4zM36 45h4v1h-4zM3 46h2v1h-2zM7 46h1v1h-1zM13 46h1v1h-1zM30 46h1v1h-1zM36 46h1v1h-1zM39 46h2v1h-2zM3 47h1v1h-1zM7 47h1v1h-1zM13 47h1v1h-1zM30 47h1v1h-1zM36 47h1v1h-1zM40 47h1v1h-1zM2 48h2v1h-2zM7 48h1v1h-1zM13 48h1v1h-1zM30 48h1v1h-1zM36 48h1v1h-1zM40 48h2v1h-2zM2 49h1v1h-1zM7 49h1v1h-1zM13 49h2v1h-2zM29 49h2v1h-2zM36 49h1v1h-1zM41 49h1v1h-1zM1 50h2v1h-2zM7 50h1v1h-1zM14 50h1v1h-1zM29 50h1v1h-1zM36 50h1v1h-1zM41 50h2v1h-2zM1 51h1v1h-1zM7 51h1v1h-1zM14 51h1v1h-1zM29 51h1v1h-1zM36 51h1v1h-1zM42 51h1v1h-1zM1 52h1v1h-1zM7 52h1v1h-1zM14 52h1v1h-1zM29 52h1v1h-1zM36 52h1v1h-1zM42 52h1v1h-1zM0 53h2v1h-2zM7 53h1v1h-1zM14 53h1v1h-1zM29 53h1v1h-1zM36 53h1v1h-1zM42 53h2v1h-2zM0 54h1v1h-1zM7 54h1v1h-1zM14 54h1v1h-1zM29 54h1v1h-1zM36 54h1v1h-1zM43 54h1v1h-1zM0 55h1v1h-1zM7 55h1v1h-1zM14 55h1v1h-1zM29 55h1v1h-1zM36 55h1v1h-1zM43 55h1v1h-1zM0 56h1v1h-1zM