[package]
name = "catalog"
version.workspace = true
edition.workspace = true

[dependencies]
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-util", "net", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
futures-util = "0.3"
getrandom = "0.3"
async-trait = "0.1"

[features]
# In-memory catalog for tests in this and other crates.
fake = []
