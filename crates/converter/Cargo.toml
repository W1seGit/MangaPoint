[package]
name = "converter"
version.workspace = true
edition.workspace = true

[dependencies]
thiserror.workspace = true
device-profiles = { path = "../device-profiles" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Image decoding (JPEG/PNG/WebP/GIF). Off for the WASM build, which decodes in the browser.
decode = ["dep:image"]
# Serialization of option enums, for saved settings.
serde = ["dep:serde"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[[example]]
name = "panels"
required-features = ["decode"]
