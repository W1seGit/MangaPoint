[package]
name = "pipeline"
version.workspace = true
edition.workspace = true

[dependencies]
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
catalog = { path = "../catalog" }
converter = { path = "../converter", features = ["decode", "serde"] }
library = { path = "../library" }
search = { path = "../search" }
device-profiles = { path = "../device-profiles", features = ["serde"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "fs", "io-util", "net"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# EPUBs are zip files; their page pictures are PNGs of 2 or 1 bits.
zip = { version = "2", default-features = false, features = ["deflate"] }
png = "0.17"
# 0.39 needs Rust 1.95; 0.37 works on 1.90 and has the same Disks API.
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }

[dev-dependencies]
catalog = { path = "../catalog", features = ["fake"] }
sources = { path = "../sources" }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }
