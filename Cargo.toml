[workspace]
resolver = "2"
members = ["apps/desktop", "apps/web", "crates/ui", "crates/formats", "crates/web-engine", "crates/device-profiles", "crates/converter", "crates/catalog", "crates/library", "crates/sources", "crates/search", "crates/pipeline"]

[workspace.package]
version = "2.0.0"
edition = "2021"

[workspace.dependencies]
thiserror = "2"


# `cargo run` builds without optimisation by default, which made converting a
# page about 14 times slower than in a release build (and an export use every
# core of the machine for minutes). The libraries that do the heavy work, and
# everything they depend on, are optimised even in a debug build; the app's own
# screens stay quick to build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.converter]
opt-level = 3

[profile.dev.package.pipeline]
opt-level = 3

[profile.dev.package.library]
opt-level = 3

[profile.dev.package.search]
opt-level = 3

[profile.dev.package.catalog]
opt-level = 3

[profile.dev.package.sources]
opt-level = 3

# The optimiser (LLVM) can recurse too deeply while analysing loops in the app's
# own code and crash the compiler in a release build (a SIGSEGV on Linux, SIGBUS on
# macOS, on Rust 1.99.1), as soon as the user interface grows past some size. The
# crash is in the compiler, so a bigger stack does not help. The app crate holds
# only the interface, so it is built at opt-level 2; the converter, pipeline and the
# rest, where speed matters, stay at the full level.
[profile.release.package.mangapoint]
opt-level = 2

# The website's two WebAssembly files (tools/build-web.*). Each is downloaded by every visitor, so they are
# built for size: whole-program optimisation (dead code goes), one code unit, no unwinding (WebAssembly
# cannot unwind anyway), and no symbol names (a third of the file, only useful to a debugger).
#   web         the page (Dioxus): smallest code ("z"), a third less to download than the speed-first build.
#   web-engine  the converter: it is what resizes and encodes pictures, so it keeps full speed.
# (wasm-opt was tried on both and makes the compressed download no smaller, so the build does not run it.)
[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.web-engine]
inherits = "web"
opt-level = 3
